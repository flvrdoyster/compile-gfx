[project]
name = "compile-gfx"
version = "0.1.0"
description = "Decoders for Compile's Disc Station and PC-98 graphics formats"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "flvrdoyster" }]
keywords = ["compile", "disc-station", "pc-98", "puyo-puyo", "retro", "preservation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: System :: Archiving",
]

[project.optional-dependencies]
png = ["pillow"]
dev = ["pillow", "pytest"]

[project.scripts]
compile-gfx = "compilegfx.cli:main"

[project.urls]
Homepage = "https://github.com/flvrdoyster/compile-gfx"
Issues = "https://github.com/flvrdoyster/compile-gfx/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
